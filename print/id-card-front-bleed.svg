<?xml version="1.0" encoding="utf-8"?>
<!-- Print-ready front artwork for K. C. Ventures employee ID
     - CR80 size with 3mm bleed
     - Document size: 91.6mm x 60mm (85.6 + 6, 54 + 6)
     - Artwork inset 3mm from edges (safe area: 3mm margin)
     - Crop marks included
-->
<svg xmlns="http://www.w3.org/2000/svg" width="91.6mm" height="60mm" viewBox="0 0 916 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .company { fill:#0b5ed7; font-family: Arial, Helvetica, sans-serif; font-weight:700 }
      .subtitle { fill:#666; font-family: Arial, Helvetica, sans-serif }
      .label { fill:#222; font-family: Arial, Helvetica, sans-serif; font-weight:700 }
      .value { fill:#222; font-family: Arial, Helvetica, sans-serif }
      .gold { fill:#C9A000 }
      .bleed { fill:none }
    </style>
  </defs>

  <!-- BLEED AREA BACKGROUND (full bleed) -->
  <rect x="0" y="0" width="916" height="600" fill="#ffffff"/>

  <!-- Card body inset (safe area) - artwork will be positioned with 3mm = 30 units offset (1 unit = 0.1mm) -->
  <!-- Conversion: 1mm = 10 units here. 3mm bleed = 30 units -->

  <!-- Left blue band (safe area starts at x=30) -->
  <rect x="0" y="0" width="240" height="600" fill="#0b5ed7" rx="14" ry="14"/>
  <!-- gold accent stripe overlapping the band (near the card edge) -->
  <rect x="230" y="10" width="18" height="580" fill="#C9A000" rx="9" ry="9" />

  <!-- Photo placeholder (positioned inside safe area, offset by bleed 30 units) -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="180" height="240" rx="8" ry="8" fill="#ffffff" stroke="#cfcfcf" stroke-width="3"/>
    <text x="90" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#808080" text-anchor="middle">Photo</text>
    <text x="90" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#808080" text-anchor="middle">(3.5 × 4.5 cm)</text>
  </g>

  <!-- Company + subtitles (safe area) -->
  <text x="270" y="70" class="company" font-size="28">K. C. Ventures</text>
  <text x="270" y="98" class="subtitle" font-size="14">Employee Identification Card</text>

  <!-- Divider line -->
  <line x1="270" y1="112" x2="886" y2="112" stroke="#eeeeee" stroke-width="1" />

  <!-- Employee info block -->
  <g transform="translate(0,0)">
    <text x="270" y="150" class="label" font-size="16">Employee Name</text>
    <text x="270" y="180" class="value" font-size="20" font-weight="800">Mr. Kelvin Daniel</text>

    <text x="270" y="220" class="label" font-size="14">Position</text>
    <text x="270" y="245" class="value" font-size="16">Managing Director</text>

    <text x="270" y="285" class="label" font-size="14">Employee ID</text>
    <text x="270" y="310" class="value" font-size="16">KCV-0001</text>

    <text x="270" y="350" class="label" font-size="14">Phone</text>
    <text x="270" y="374" class="value" font-size="14">+234 703 133 6258</text>

    <text x="270" y="408" class="label" font-size="14">Email</text>
    <text x="270" y="432" class="value" font-size="14">kelvindaniel1022@gmail.com</text>

    <text x="270" y="470" class="label" font-size="14">Status</text>
    <rect x="330" y="448" width="90" height="34" rx="8" ry="8" fill="#C9A000"/>
    <text x="375" y="471" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Active</text>
  </g>

  <!-- QR code placeholder -->
  <g transform="translate(660,320)">
    <rect x="0" y="0" width="160" height="160" rx="8" ry="8" fill="#f5f5f5" stroke="#cfcfcf" />
    <text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#888888" text-anchor="middle">QR Code</text>
  </g>

  <!-- Barcode stylized placeholder -->
  <g transform="translate(330,490)">
    <rect x="0" y="0" width="360" height="30" fill="#ffffff" stroke="#ddd"/>
    <!-- stylized bars: purely decorative -->
    <rect x="8" y="2" width="4" height="26" fill="#000"/>
    <rect x="22" y="2" width="2" height="26" fill="#000"/>
    <rect x="34" y="2" width="6" height="26" fill="#000"/>
    <rect x="56" y="2" width="3" height="26" fill="#000"/>
    <rect x="76" y="2" width="2" height="26" fill="#000"/>
    <rect x="92" y="2" width="5" height="26" fill="#000"/>
    <rect x="120" y="2" width="4" height="26" fill="#000"/>
    <rect x="150" y="2" width="2" height="26" fill="#000"/>
    <rect x="176" y="2" width="6" height="26" fill="#000"/>
    <rect x="210" y="2" width="3" height="26" fill="#000"/>
    <rect x="236" y="2" width="5" height="26" fill="#000"/>
    <rect x="270" y="2" width="3" height="26" fill="#000"/>
    <rect x="302" y="2" width="4" height="26" fill="#000"/>
  </g>

  <!-- Ownership text -->
  <text x="270" y="528" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#555555">Property of K. C. Ventures. If found, please return to the company.</text>

  <!-- Subtle company mark on blue band -->
  <g transform="translate(20,330)" opacity="0.08">
    <circle cx="120" cy="60" r="48" fill="#ffffff" />
    <text x="120" y="68" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">KCV</text>
  </g>

  <!-- Crop marks (outside bleed area) -->
  <g stroke="#000" stroke-width="1" stroke-linecap="square" fill="none">
    <!-- Top-left -->
    <line x1="10" y1="10" x2="60" y2="10" />
    <line x1="10" y1="10" x2="10" y2="60" />
    <!-- Top-right -->
    <line x1="856" y1="10" x2="906" y2="10" />
    <line x1="906" y1="10" x2="906" y2="60" />
    <!-- Bottom-left -->
    <line x1="10" y1="590" x2="60" y2="590" />
    <line x1="10" y1="540" x2="10" y2="590" />
    <!-- Bottom-right -->
    <line x1="856" y1="590" x2="906" y2="590" />
    <line x1="906" y1="540" x2="906" y2="590" />
  </g>

  <!-- Small registration text for printer -->
  <text x="456" y="595" font-family="Arial, Helvetica, sans-serif" font-size="6" fill="#666666" text-anchor="middle">CR80 ID FRONT — 85.6×54 mm + 3 mm bleed — Do not scale</text>
</svg>
